<title>وظائف القيادة التربوية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
/* Layout: academic folio — 16:9 ivory sheet, olive structure, navy text. Each content slide has two panes (التأصيل النظري / التطبيق والمقارنة) so large type fits; tools on top, numbered navigation below. */
:root{
  --olive:#2D5A27; --sage:#4A7C59; --ivory:#F9F9F6; --navy:#1B2A4A; --gold:#B8923A;
  --bg:#ECEEE8; --paper:#F9F9F6; --surface:#FFFFFF; --tint:#E6EEE2; --tint2:#F1F4EE;
  --ink:#1B2A4A; --ink2:#26332D; --muted:#56625A; --line:#D5DBD1; --accent:#2D5A27; --accent2:#4A7C59; --gold-ink:#7A5F1C;
  --good:#23764A; --good-bg:#E1F2E7; --warn:#9A6208; --warn-bg:#FAF0DA; --bad:#A33A33; --bad-bg:#F8E3E0;
  --shadow:0 1px 2px rgba(27,42,74,.06),0 10px 28px rgba(27,42,74,.08);
  --f:"Cairo","Tajawal","Segoe UI",Tahoma,sans-serif; --fs:1; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1512; --paper:#141D19; --surface:#1A2520; --tint:#1D3122; --tint2:#18241E;
  --ink:#EEF2EE; --ink2:#DCE3DC; --muted:#A8B4AB; --line:#2B3A32; --accent:#9CCB8F; --accent2:#86BE98; --gold-ink:#DDBE6E;
  --good:#7BD19A; --good-bg:#173A28; --warn:#E8B85A; --warn-bg:#3A2E14; --bad:#F08E85; --bad-bg:#3D1F1F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512; --paper:#141D19; --surface:#1A2520; --tint:#1D3122; --tint2:#18241E;
  --ink:#EEF2EE; --ink2:#DCE3DC; --muted:#A8B4AB; --line:#2B3A32; --accent:#9CCB8F; --accent2:#86BE98; --gold-ink:#DDBE6E;
  --good:#7BD19A; --good-bg:#173A28; --warn:#E8B85A; --warn-bg:#3A2E14; --bad:#F08E85; --bad-bg:#3D1F1F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{direction:rtl}
body{background:var(--bg);color:var(--ink);font-family:var(--f);direction:rtl;text-align:right;margin:0;line-height:1.7}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
bdi,.ltr{unicode-bidi:isolate;direction:ltr;white-space:nowrap}
bdi.url{white-space:normal;word-break:break-all}
.app{height:100%;display:flex;flex-direction:column;gap:8px;padding-inline:16px;padding-block:10px}
.app:fullscreen{background:var(--bg);padding:12px 20px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;margin-inline-end:auto}
.brand b{font-weight:800;font-size:1.12rem;color:var(--accent);line-height:1.3}
.brand span{font-size:.78rem;color:var(--muted)}
.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;font-size:.88rem;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent2)}
.fsz{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);direction:ltr}
.fsz button{border:0;background:none;padding:6px 13px;cursor:pointer;font-weight:800;font-size:.95rem}
.fsz button+button,.fsz output{border-left:1px solid var(--line)}
.fsz button:hover{background:var(--tint)}
.fsz output{padding:6px 9px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:3.6em;text-align:center}
.export{background:var(--olive);color:#fff;border-color:var(--olive);font-weight:800}
.export:hover{background:var(--sage);border-color:var(--sage)}
.export[disabled]{opacity:.55;cursor:not-allowed}
.prog{height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--olive);transition:width .3s;margin-inline-start:0}
.toast{font-size:.82rem;color:var(--muted);min-height:1.2em}

.stage{flex:1;min-height:0;display:grid;place-items:center}
.frame{width:min(100%,calc((100dvh - 156px)*16/9));aspect-ratio:16/9;container-type:inline-size;position:relative;max-width:100%}
.app:fullscreen .frame{width:min(100%,calc((100dvh - 118px)*16/9))}
.slide{--u:calc(1cqw * var(--fs));position:absolute;inset:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  display:none;flex-direction:column;padding:calc(1cqw*2.4) calc(1cqw*3.4) calc(1cqw*1.6);overflow:hidden;font-size:calc(var(--u)*2);color:var(--ink2);direction:rtl;text-align:right;line-height:1.65}
.slide.active{display:flex;animation:in .3s ease}
@keyframes in{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide.active{animation:none}}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:calc(1cqw*2);margin-bottom:calc(1cqw*1.2);flex-wrap:wrap}
.hd .ttl{min-width:0}
.eb{font-size:calc(var(--u)*1.25);font-weight:700;color:var(--gold-ink)}
.slide h2{font-weight:800;font-size:calc(var(--u)*2.95);line-height:1.25;margin:0;color:var(--ink);text-wrap:balance}
.slide h3{font-weight:800;font-size:calc(var(--u)*1.7);margin:0 0 calc(1cqw*.5);color:var(--accent)}
.slide p{margin:0 0 calc(1cqw*.7)}
.slide ul,.slide ol{direction:rtl;text-align:right;padding-right:1.5rem;padding-left:0;margin:0;list-style-position:inside;display:grid;gap:calc(1cqw*.35)}
.slide li{direction:rtl;text-align:right}
.slide li::marker{color:var(--gold)}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--surface);flex:none}
.tabs button{border:0;background:none;padding:calc(1cqw*.35) calc(1cqw*1.3);font-size:calc(1cqw*1.2);font-weight:700;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--olive);color:#fff}
.pane{flex:1;min-height:0;overflow:auto}
.cite{color:var(--gold-ink);font-weight:600}
.crit{margin-top:calc(1cqw*.8);background:var(--tint2);border-radius:calc(1cqw*.7);padding:calc(1cqw*.9) calc(1cqw*1.2)}
.crit b{color:var(--gold-ink)}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:calc(1cqw*1.8);align-items:start}
.appbox{background:var(--tint);border-radius:calc(1cqw*.8);padding:calc(1cqw*1.1) calc(1cqw*1.4)}
.pn{position:absolute;inset-inline-start:calc(1cqw*1.4);bottom:calc(1cqw*.9);font-size:calc(1cqw*1.05);color:var(--muted);font-variant-numeric:tabular-nums}

/* visuals */
.cards{display:grid;gap:calc(1cqw*.7)}
.flip{perspective:1000px;border:0;background:none;padding:0;cursor:pointer;text-align:right;min-height:calc(var(--u)*7);position:relative;width:100%}
.flip .in{position:absolute;inset:0;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flip[aria-pressed="true"] .in{transform:rotateY(180deg)}
.flip .fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:calc(1cqw*.6);padding:calc(1cqw*.6) calc(1cqw*1);overflow:auto;display:flex;flex-direction:column;gap:calc(1cqw*.1);justify-content:center}
.flip .fr{background:var(--surface);border:1px solid var(--line)}
.flip:hover .fr{border-color:var(--accent2)}
.flip .bk{background:var(--olive);color:#F2F5F0;transform:rotateY(180deg)}
.flip .k{font-size:calc(var(--u)*1.05);font-weight:800;color:var(--gold-ink)}
.flip .bk .k{color:#E7CF8C}
.flip .t{font-weight:700;font-size:calc(var(--u)*1.55);line-height:1.4;color:var(--ink)}
.flip .bk .t{color:#fff}
.cmph{font-size:calc(var(--u)*1.1);font-weight:700;color:var(--muted);margin-bottom:calc(1cqw*.4)}
@media (prefers-reduced-motion:reduce){.flip .in{transition:none}}
table.t{width:100%;border-collapse:collapse;font-size:calc(var(--u)*1.6);direction:rtl}
table.t th,table.t td{padding:calc(1cqw*.45) calc(1cqw*.7);border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
table.t thead th{color:var(--gold-ink);font-weight:800;font-size:calc(var(--u)*1.3)}
table.t tbody th{color:var(--accent);font-weight:800;white-space:nowrap}
.steps{counter-reset:s;display:grid;gap:calc(1cqw*.5);padding:0!important;list-style:none!important}
.steps li{display:grid;grid-template-columns:calc(1cqw*2.8) 1fr;gap:calc(1cqw*.8);align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:calc(1cqw*.6);padding:calc(1cqw*.45) calc(1cqw*.8)}
.steps li::before{counter-increment:s;content:counter(s);width:calc(1cqw*2.8);height:calc(1cqw*2.8);border-radius:50%;background:var(--olive);color:#fff;display:grid;place-items:center;font-weight:800;font-size:calc(var(--u)*1.3)}
.refs p{margin:0 0 calc(1cqw*.7);padding-right:2em;text-indent:-2em;font-size:calc(var(--u)*1.45);line-height:1.6}
.refs p.en{direction:ltr;text-align:left;padding-left:2em;padding-right:0}
.refs h3{margin-top:calc(1cqw*.4)}

/* cover */
.slide.cover{background:var(--olive);color:#F4F7F2;border-color:transparent;padding:calc(1cqw*3) calc(1cqw*5);align-items:center;text-align:center;justify-content:center;gap:calc(1cqw*1.4)}
:root[data-theme="dark"] .slide.cover{background:#1F3F1B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .slide.cover{background:#1F3F1B}}
.logo{background:#fff;border-radius:calc(1cqw*1.2);padding:calc(1cqw*.6) calc(1cqw*2);box-shadow:0 6px 20px rgba(0,0,0,.18)}
.logo img{display:block;width:calc(1cqw*26);height:auto;max-width:100%}
.cover .ey{color:#E7CF8C;font-weight:700;font-size:calc(var(--u)*1.5)}
.cover h1{font-weight:800;font-size:calc(var(--u)*4);line-height:1.3;margin:0;text-wrap:balance}
.cover .meta{display:grid;gap:calc(1cqw*.3);font-size:calc(var(--u)*1.65)}
.cover .meta b{color:#E7CF8C;font-weight:700}

/* interactive slides */
.slide.ixs{font-size:calc(var(--u)*1.55)}
.ixlead{font-size:calc(var(--u)*1.5);color:var(--muted);margin:0 0 calc(1cqw*.9)!important}
.ix{min-width:0}
.ixcol{display:grid;gap:calc(1cqw*.9);align-content:start;min-width:0}
.ixcard{background:var(--surface);border:1px solid var(--line);border-radius:calc(1cqw*.8);padding:calc(1cqw*1) calc(1cqw*1.3)}
.ixs .appbox p{margin:0}
.toggles{display:flex;gap:calc(1cqw*1.4);flex-wrap:wrap}
.tg{display:flex;align-items:center;gap:calc(1cqw*.6);font-size:calc(var(--u)*1.4)}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.seg2 button{border:0;background:var(--surface);padding:calc(1cqw*.2) calc(1cqw*1.1);cursor:pointer;font-size:calc(var(--u)*1.35);font-weight:700}
.seg2 button[aria-pressed="true"]{background:var(--olive);color:#fff}
.mx{display:grid;grid-template-columns:auto 1fr 1fr;gap:calc(1cqw*.5)}
.mx .h{color:var(--muted);font-size:calc(var(--u)*1.15);display:grid;place-items:center;text-align:center}
.mx .c{background:var(--surface);border:1px solid var(--line);border-radius:calc(1cqw*.6);padding:calc(1cqw*.8);text-align:center;display:grid;place-items:center;min-height:calc(1cqw*6.5);font-weight:700;font-size:calc(var(--u)*1.4);transition:background .2s,color .2s}
.mx .c.on{background:var(--olive);color:#fff;border-color:var(--olive)}
.mxout{background:var(--tint);border-radius:calc(1cqw*.7);padding:calc(1cqw*.9) calc(1cqw*1.2);margin:0!important;font-size:calc(var(--u)*1.4)}
.dash{display:grid;grid-template-columns:calc(1cqw*19) 1fr 1.15fr;gap:calc(1cqw*1.3)}
.fnlist{display:grid;gap:calc(1cqw*.45);align-content:start}
.fnbtn{border:1px solid var(--line);background:var(--surface);border-radius:calc(1cqw*.6);padding:calc(1cqw*.55) calc(1cqw*.9);text-align:right;cursor:pointer;font-size:calc(var(--u)*1.35);font-weight:600}
.fnbtn[aria-pressed="true"]{background:var(--olive);color:#fff;border-color:var(--olive)}
.kpis{display:grid;gap:calc(1cqw*.55);align-content:start;min-width:0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:calc(1cqw*.6);padding:calc(1cqw*.6) calc(1cqw*.9);font-size:calc(var(--u)*1.3);line-height:1.5}
.kpi.q{background:var(--tint)}
.kpi .src{display:block;font-size:calc(var(--u)*1.05);font-weight:700;color:var(--gold-ink)}
.chip{display:inline-block;font-size:calc(var(--u)*1.1);font-weight:700;padding:0 calc(1cqw*.8);border-radius:99px;background:var(--tint);color:var(--accent)}
.sample{font-size:calc(var(--u)*1.05);color:var(--gold-ink);font-weight:700}
.sliders{display:grid;gap:calc(1cqw*.4);font-size:calc(var(--u)*1.25)}
.sliders label{display:grid;grid-template-columns:1fr auto;gap:0 calc(1cqw*.8);align-items:center}
.sliders input{grid-column:1/-1;width:100%;accent-color:#2D5A27}
.sliders output{font-variant-numeric:tabular-nums;font-weight:800;color:var(--accent)}
.chart svg{width:100%;height:auto;display:block}
.chart .axis{font-size:calc(var(--u)*1);color:var(--muted);text-align:center}
.readout{display:flex;gap:calc(1cqw*1.2);flex-wrap:wrap;font-size:calc(var(--u)*1.25)}
.readout b{color:var(--accent);font-variant-numeric:tabular-nums}
.sim{display:grid;grid-template-columns:calc(1cqw*24) 1fr;gap:calc(1cqw*1.4)}
.scnl{display:grid;gap:calc(1cqw*.45)}
.scnbtn{display:flex;gap:calc(1cqw*.7);align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:calc(1cqw*.6);padding:calc(1cqw*.55) calc(1cqw*.9);text-align:right;cursor:pointer;font-size:calc(var(--u)*1.3)}
.scnbtn[aria-pressed="true"]{border-color:var(--olive);box-shadow:inset -4px 0 0 var(--olive)}
.st{width:calc(1cqw*1.2);height:calc(1cqw*1.2);border-radius:50%;border:1.5px solid var(--line);flex:none}
.st.good{background:var(--good);border-color:var(--good)} .st.part{background:var(--warn);border-color:var(--warn)} .st.bad{background:var(--bad);border-color:var(--bad)}
.score{font-size:calc(var(--u)*1.2);color:var(--muted)} .score b{color:var(--accent)}
.simreset{justify-self:start}
.case{display:grid;gap:calc(1cqw*.7);align-content:start;min-width:0}
.ctx{font-size:calc(var(--u)*1.5);margin:0!important}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:calc(1cqw*.6)}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:calc(1cqw*.6);padding:calc(1cqw*.7) calc(1cqw*.9);text-align:right;cursor:pointer;font-size:calc(var(--u)*1.3);line-height:1.55}
.opt:hover{border-color:var(--accent2)}
.opt.good{background:var(--good-bg);border-color:var(--good)} .opt.part{background:var(--warn-bg);border-color:var(--warn)} .opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.hint{font-size:calc(var(--u)*1.1);color:var(--muted);margin:0!important}
.fb{background:var(--tint2);border-radius:calc(1cqw*.6);padding:calc(1cqw*.8) calc(1cqw*1.1);font-size:calc(var(--u)*1.3)}
.fb .v{font-weight:800} .v.good{color:var(--good)} .v.part{color:var(--warn)} .v.bad{color:var(--bad)}
.fb .ref{display:block;margin-top:calc(1cqw*.3);font-size:calc(var(--u)*1.1)}
.chlw{display:grid;gap:calc(1cqw*1)}
.models{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(1cqw*.8)}
.model{border-radius:calc(1cqw*.7);padding:calc(1cqw*.8) calc(1cqw*1.1);background:var(--tint);font-size:calc(var(--u)*1.25);line-height:1.5;border:2px solid transparent}
.model b{display:block;color:var(--accent);font-size:calc(var(--u)*1.45)}
.model.hl{border-color:var(--gold);background:var(--surface)}
.chl{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(1cqw*.6)}
.chbtn{border:1px solid var(--line);background:var(--surface);border-radius:calc(1cqw*.6);padding:calc(1cqw*.6) calc(1cqw*.9);text-align:right;cursor:pointer;font-size:calc(var(--u)*1.35);font-weight:600}
.chbtn[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme="dark"] .chbtn[aria-pressed="true"]{background:#2D5A27;border-color:#2D5A27}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chbtn[aria-pressed="true"]{background:#2D5A27;border-color:#2D5A27}}
.chlout p{margin:0;font-size:calc(var(--u)*1.5)}
@media (max-width:760px){.dash,.sim,.opts,.models,.chl{grid-template-columns:1fr}}

/* nav */
.bottom{display:flex;align-items:center;gap:10px}
.nb{width:42px;height:42px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.1rem;display:grid;place-items:center;flex:none}
.nb.p{background:var(--olive);color:#fff;border-color:var(--olive)}
.nb[disabled]{opacity:.4;cursor:default}
.nums{flex:1;display:flex;gap:4px;overflow-x:auto;justify-content:center;padding-block:2px}
.num{min-width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.88rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.num:hover{border-color:var(--accent2)}
.num.done{color:var(--accent);background:var(--tint)}
.num[aria-current="true"]{background:var(--olive);color:#fff;border-color:var(--olive)}

@media (max-width:760px){
  .frame{aspect-ratio:auto;width:100%;height:100%;container-type:normal}
  .stage{place-items:stretch}
  .slide{--u:calc(8.5px * var(--fs));padding:16px 16px 26px;overflow:auto}
  .two{grid-template-columns:1fr}
  .logo img{width:220px}
  .brand span{display:none}
  .nums{justify-content:flex-start}
  .tabs button{font-size:13px;padding:5px 12px}
}
</style>

<div class="app" id="app" dir="rtl">
  <div class="top">
    <div class="brand"><b>وظائف القيادة التربوية وتطبيقاتها</b><span>601 قدت · كلية التربية · جامعة الجوف</span></div>
    <div class="ctl">
      <div class="fsz" role="group" aria-label="حجم الخط">
        <button type="button" id="fPlus" aria-label="تكبير الخط">A+</button>
        <button type="button" id="fMinus" aria-label="تصغير الخط">A−</button>
        <button type="button" id="fReset" aria-label="إعادة الحجم الافتراضي">Reset</button>
        <output id="fOut">100%</output>
      </div>
      <button class="btn" type="button" id="bFull">ملء الشاشة</button>
    </div>
  </div>
  <div class="prog" aria-hidden="true"><i id="progBar"></i></div>
  <div class="toast" id="toast" aria-live="polite"></div>
  <div class="stage"><div class="frame" id="frame"></div></div>
  <div class="bottom">
    <button class="nb" type="button" id="prev" aria-label="السابق">→</button>
    <nav class="nums" id="nums" aria-label="الشرائح"></nav>
    <button class="nb p" type="button" id="next" aria-label="التالي">←</button>
  </div>
